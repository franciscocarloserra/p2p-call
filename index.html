<!doctype html>
<!-- Source: https://github.com/franciscocarloserra/p2p-call -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>p2p call</title>
<link rel="icon" href="data:,">
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#111;color:#ddd;font:15px/1.4 ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;height:100dvh}
  #bar{display:flex;gap:12px;align-items:center;padding:10px 12px;font-size:.85em;color:#888;border-bottom:1px solid #222}
  #status{flex:1}
  #bar button{all:unset;cursor:pointer;text-decoration:underline}
  #bar button.off{color:#c55}
  #grid{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:4px;padding:4px}
  @media (orientation:portrait){#grid{grid-auto-flow:row;grid-auto-rows:minmax(0,1fr);grid-template-rows:none;grid-template-columns:minmax(0,1fr)}}
  video{width:100%;height:100%;min-height:0;min-width:0;object-fit:contain;background:#000;border-radius:4px}
  #me{transform:scaleX(-1)}
  #lobby{margin:auto;display:flex;flex-direction:column;gap:12px}
  #lobby button{padding:16px 28px;font:inherit;background:#222;color:#eee;border:1px solid #444;border-radius:6px;cursor:pointer}
</style></head><body>
<div id="bar"><span id="status">idle</span><button id="mic">mic</button><button id="cam">cam</button><button id="copy">share link</button></div>
<div id="grid"><div id="lobby"><button id="start">join call</button><button id="share">share link</button></div></div>
<script type="module" src="ui.js"></script></body></html>
